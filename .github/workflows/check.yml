name: Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Перевірка програми + astro check + збирання — те саме, що npm run build локально
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
