name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # оновлення релізу offline з архівом сайту
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: 1
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
      # Офлайн-копія для флешки: інтернет у ліцеї вимикають під час тривоги.
      # Відкривати командою python -m http.server -d ra97-site (див. README).
      - name: Update offline release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp -r dist ra97-site && zip -qr ra97-site.zip ra97-site
          gh release view offline >/dev/null 2>&1 || gh release create offline --title "Офлайн-копія сайту" --notes "Архів сайту для роботи без інтернету. Оновлюється після кожної публікації."
          gh release upload offline ra97-site.zip --clobber

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
